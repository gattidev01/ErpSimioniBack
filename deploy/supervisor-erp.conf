; Fila de jobs do ERP (e-mail, WhatsApp, relatórios, backup) sempre rodando.
; __BACK__ é preenchido pelo instalar-servidor.sh.
[program:erp-fila]
command=/usr/bin/php __BACK__/artisan queue:work --tries=3 --backoff=60 --max-time=3600 --sleep=3
directory=__BACK__
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/var/log/erp-fila.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
