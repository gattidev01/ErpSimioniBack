# Site do ERP: front (React compilado) e API (Laravel) no mesmo domínio.
# Os marcadores __X__ são preenchidos pelo instalar-servidor.sh.
# O Certbot acrescenta o bloco HTTPS (porta 443) e o redirecionamento automaticamente.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    root __FRONT__/dist;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 12m;   # upload do logo

    include snippets/erp-seguranca.conf;

    # API e cookie CSRF do Sanctum -> Laravel (PHP-FPM)
    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __BACK__/public/index.php;
        fastcgi_param DOCUMENT_ROOT __BACK__/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # arquivos do build têm hash no nome: cache longo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/erp-seguranca.conf;
    }

    # index.html nunca em cache (para cada atualização chegar na hora)
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/erp-seguranca.conf;
    }

    # rotas do React (ex.: /orcamentos/123) caem no index.html
    location / {
        try_files $uri /index.html;
    }

    # nada de arquivos ocultos (.git, .env...)
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/erp-access.log;
    error_log  /var/log/nginx/erp-error.log warn;
}
